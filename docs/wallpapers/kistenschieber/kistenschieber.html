// Hintergrund „Kistenschieber – An der Kaje“, 3840 × 2160, gezeichnet auf 1920 × 1080 Einheiten (Faktor 2).
// Deterministisch: aller Zufall kommt aus mulberry32 mit festen Seeds.
const W = 1920, H = 1080, S = 2, HZ = 292; // HZ: Horizontlinie
const cv = document.getElementById('c'), X = cv.getContext('2d');

const INK = '#1d2838';

function rng(seed) { return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
let R = rng(20261127);
const rr = (a, b) => a + R() * (b - a);

// ---------- Ansicht (isometrisch 2:1) ----------
let TW = 118, BH = 64, OX = 960, OY = 690;
const view = (tw, bh, ox, oy) => { TW = tw; BH = bh; OX = ox; OY = oy; };
const P = (i, j, z = 0) => [OX + (i - j) * TW / 2, OY + (i + j) * TW / 4 - z * BH];
const Ei = () => [TW / 2, TW / 4], Ej = () => [-TW / 2, TW / 4], Ez = () => [0, BH];

// ---------- Farben ----------
const shadeCache = new Map();
function shade(hex, f) {
  const key = hex + f; let v = shadeCache.get(key); if (v) return v;
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  if (f < 0) { r *= 1 + f; g *= 1 + f; b *= 1 + f; } else { r += (255 - r) * f; g += (255 - g) * f; b += (255 - b) * f; }
  v = `rgb(${r | 0},${g | 0},${b | 0})`; shadeCache.set(key, v); return v;
}

// ---------- Texturen (64 Einheiten, 128 px; Kai-Texturen wie im Spiel) ----------
function tex(draw, seed) { const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d'); x.scale(2, 2); draw(x, rng(seed)); return c; }
function rrect(x, X0, Y0, W0, H0, r) { x.beginPath(); x.roundRect(X0, Y0, W0, H0, r); }
const pickR = (Rn, arr) => arr[Math.floor(Rn() * arr.length)];
function speckle(x, Rn, n, cols, sz = 0.7) { for (let i = 0; i < n; i++) { x.fillStyle = cols[i % cols.length]; x.fillRect(Rn() * 64, Rn() * 64, sz, sz); } }

}

// Klinker der Speicher: kleinere Steine, Reihen hochkant gesehen

    x.fillStyle = '#3b2a1e'; x.fillRect(p * 16 + 7, 6, 1.3, 1.3); x.fillRect(p * 16 + 7, 56, 1.3, 1.3);

  speckle(x, Rn, 260, ['#d6b979', '#fbefcb', '#c9a96a', '#e9d2a0'], 1);

T.sandSeite = tex((x, Rn) => {

T.fels = tex((x, Rn) => {

  speckle(x, Rn, 300, ['rgba(60,66,76,.5)', 'rgba(230,235,240,.5)']);

// ---------- Flächen und Blöcke ----------
const add = (a, b) => [a[0] + b[0], a[1] + b[1]], mul = (a, k) => [a[0] * k, a[1] * k];
function tile(t, o, eu, ev, fu = 1, fv = 1) {
  X.save(); X.transform(eu[0] / 128, eu[1] / 128, ev[0] / 128, ev[1] / 128, o[0], o[1]);
  X.drawImage(t, 0, 0, Math.max(1, 128 * fu), Math.max(1, 128 * fv), 0, 0, 128 * fu + 0.8, 128 * fv + 0.8); X.restore();
}
function polyF(pts, fill, stroke, lw) {
  X.beginPath(); X.moveTo(pts[0][0], pts[0][1]); for (let n = 1; n < pts.length; n++) X.lineTo(pts[n][0], pts[n][1]); X.closePath();
  if (fill) { X.fillStyle = fill; X.fill(); }
  if (stroke) { X.strokeStyle = stroke; X.lineWidth = lw || 1; X.stroke(); }
}
const faceTop = (i, j, z, w, d) => [P(i, j, z), P(i + w, j, z), P(i + w, j + d, z), P(i, j + d, z)];
const faceL = (i, j, z, w, d, h) => [P(i, j + d, z + h), P(i + w, j + d, z + h), P(i + w, j + d, z), P(i, j + d, z)];
const faceR = (i, j, z, w, d, h) => [P(i + w, j, z + h), P(i + w, j + d, z + h), P(i + w, j + d, z), P(i + w, j, z)];
// Gekachelte Fläche: u entlang a (Länge la), v entlang b (Länge lb), Ursprung o(u,v)
function tiled(t, org, ea, eb, la, lb, whole) {
  if (whole) { tile(t, org(0, 0), mul(ea, la), mul(eb, lb)); return; }
  for (let a = 0; a < la - 1e-6; a++) for (let b = 0; b < lb - 1e-6; b++) tile(t, org(a, b), ea, eb, Math.min(1, la - a), Math.min(1, lb - b));
}
// Block mit Texturen: top, side (beide Seiten) oder sideR; whole: Textur über die ganze Fläche
function tbox(i, j, z, w, d, h, o) {
  const zt = z + h, avgTop = o.topCol || '#999', avgSide = o.sideCol || '#888';
  const L = faceL(i, j, z, w, d, h), Rf = faceR(i, j, z, w, d, h), Tp = faceTop(i, j, zt, w, d);
  if (h > 0) {
    polyF(L, avgSide, avgSide, 0.8);
    X.save(); X.beginPath(); L.forEach((p, n) => n ? X.lineTo(...p) : X.moveTo(...p)); X.closePath(); X.clip();
    tiled(o.sideL || o.side, (a, b) => P(i + a, j + d, zt - b), Ei(), Ez(), w, h, o.whole); polyF(L, `rgba(0,0,0,${o.shL ?? 0.1})`); X.restore();
    polyF(Rf, shade(avgSide, -0.2), shade(avgSide, -0.2), 0.8);
    X.save(); X.beginPath(); Rf.forEach((p, n) => n ? X.lineTo(...p) : X.moveTo(...p)); X.closePath(); X.clip();
    tiled(o.sideR || o.side, (a, b) => P(i + w, j + a, zt - b), Ej(), Ez(), d, h, o.whole); polyF(Rf, `rgba(0,0,0,${o.shR ?? 0.28})`); X.restore();
  }
  if (o.top) {
    polyF(Tp, avgTop, avgTop, 0.8);
    X.save(); X.beginPath(); Tp.forEach((p, n) => n ? X.lineTo(...p) : X.moveTo(...p)); X.closePath(); X.clip();
    tiled(o.top, (a, b) => P(i + a, j + b, zt), Ei(), Ej(), w, d, o.whole); polyF(Tp, 'rgba(255,255,255,.06)'); X.restore();
  }
  if (o.edge) { X.strokeStyle = o.edge; X.lineWidth = 1.2; X.beginPath(); X.moveTo(...P(i, j + d, zt)); X.lineTo(...P(i + w, j + d, zt)); X.lineTo(...P(i + w, j, zt)); X.stroke(); }
}
function cuboid(i0, j0, z0, w, d, h, col, top) {
  const L = faceL(i0, j0, z0, w, d, h), Rf = faceR(i0, j0, z0, w, d, h), Tp = faceTop(i0, j0, z0 + h, w, d);
  polyF(L, shade(col, -0.1), shade(col, -0.1), 0.5);
  polyF(Rf, shade(col, -0.28), shade(col, -0.28), 0.5);
  polyF(Tp, shade(top || col, 0.05), shade(top || col, 0.05), 0.5);

// ---------- Sortierung (Trennachsen, dann topologisch) ----------
function sbox(o) {
  const [i0, i1, j0, j1, z0, z1] = o.b; let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (const i of [i0, i1]) for (const j of [j0, j1]) for (const z of [z0, z1]) { const [x, y] = P(i, j, z); x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  return [x0, x1, y0, y1];
}
function cmp(A, B) {

}
const keyOf = o => o.k ?? ((o.b[0] + o.b[1]) / 2 + (o.b[2] + o.b[3]) / 2 + (o.b[4] + o.b[5]) / 2 * 0.3);
function sortDraw(list) {

  for (let a = 0; a < n; a++) for (let c = a + 1; c < n; c++) {

    if (r < 0) { out[a].push(c); indeg[c]++; } else { out[c].push(a); indeg[a]++; }

// ---------- Modelle aus Quadern (wie im Spiel) ----------
const FWD = { i: [1, 0], '-i': [-1, 0], j: [0, 1], '-j': [0, -1] };

  for (const p of parts) {
    const [f0, s0, z0, fl, sw, h0, col, top, nrm] = p;
    if (nrm) { const nn = nrm === 'f' ? [fi, fj] : nrm === 's+' ? [si, sj] : [-si, -sj]; if (!seen(nn)) continue; }
    const f = f0 * sc, s = s0 * sc, zz = z + z0 * sc, L = fl * sc, Wd = sw * sc, Hh = h0 * sc;
    const ai = ci + fi * f + si * s, aj = cj + fj * f + sj * s, bi = ci + fi * (f + L) + si * (s + Wd), bj = cj + fj * (f + L) + sj * (s + Wd);
    const i0 = Math.min(ai, bi), j0 = Math.min(aj, bj), w = Math.abs(bi - ai), d = Math.abs(bj - aj);
    out.push({ b: [i0, i0 + w, j0, j0 + d, zz, zz + Hh], k: i0 + w / 2 + j0 + d / 2 + (zz + Hh / 2) * 0.3 + (nrm ? 0.05 : 0), draw: () => cuboid(i0, j0, zz, w, d, Hh, col, top) });

function boat(i0, j0, len, wid, hull, band, inner) {

  for (const [a, b, f] of segs) {
    const w2 = wid * f, jj = j0 + (wid - w2) / 2;
    parts.push({ b: [i0 + a, i0 + b, jj, jj + w2, -0.05, 0.42], draw: () => { cuboid(i0 + a, jj, -0.05, b - a, w2, 0.42, hull, inner); polyF(faceL(i0 + a, jj, 0.24, b - a, w2, 0.07), band); polyF(faceR(i0 + a, jj, 0.24, b - a, w2, 0.07), shade(band, -0.25)); } });
  }
  return parts;
}
